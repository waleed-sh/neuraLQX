name: Documentation

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-version:
    # No runner is started for releases marked as prereleases on GitHub.
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.version.outputs.eligible }}
    steps:
      - name: Check minimum stable release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os
          import re

          # Accept stable vMAJOR.MINOR.PATCH tags, with or without the v prefix.
          match = re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", os.environ["RELEASE_TAG"])
          eligible = bool(match and tuple(map(int, match.groups())) >= (2, 0, 0))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"eligible={str(eligible).lower()}", file=output)

  build:
    needs: release-version
    if: needs.release-version.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation requirements
        run: python -m pip install -r docs/requirements.txt
      - name: Check documentation infrastructure
        run: python -m unittest discover -s tests/docs -v
      - name: Build documentation
        run: python -m mkdocs build --strict
