name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu (unit tests)"
            os: ubuntu-latest
            python-version: "3.13"
            kind: "main"

          - name: "macOS (unit tests)"
            os: macos-latest
            python-version: "3.13"
            kind: "main"

          - name: "Doctests"
            os: ubuntu-latest
            python-version: "3.13"
            kind: "doctest"

    env:
      NQX_TESTING: "1"
      NQX_EXPERIMENTAL: "1"
      NETKET_EXPERIMENTAL: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-tags: true

      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Main tests
        if: ${{ matrix.kind == 'main' }}
        run: |
          uv run pytest --cov=neuralqx --cov-report=xml

      - name: Doc tests
        if: ${{ matrix.kind == 'doctest' }}
        run: |
          uv run pytest --cov=neuralqx --cov-append --cov-report=xml --doctest-continue-on-failure --doctest-modules neuralqx/

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: coverage.xml
