hooks:
  - docs/hooks/api.py
  - docs/hooks/notebooks.py

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      # Commit the notebook's saved outputs. Builds never start a kernel.
      execute: false
      allow_errors: false
      include_source: true
      include_requirejs: true
      cache: true
      cache_dir: .cache/mkdocs-jupyter
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            # Source analysis only: RTD does not install/import JAX or neuraLQX.
            allow_inspection: false
            docstring_style: google
            # Existing docstring formatting will be addressed when writing docs.
            # Strict MkDocs checks still catch broken navigation and page links.
            docstring_options:
              warnings: false
            show_root_heading: true
            show_root_full_path: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            inherited_members: false
            show_submodules: false
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - codehilite:
      guess_lang: false
  - pymdownx.superfences:
      # Match the theme's code block and syntax highlighting styles.
      css_class: codehilite
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/stylesheets/theme.css

extra_javascript:
  - assets/javascripts/navigation.js

exclude_docs: |
  **/AGENTS.md
  /requirements.txt
  /hooks/
  /overrides/
  /README.md
  **/.ipynb_checkpoints/

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

watch:
  - neuralqx
