site_name: neuraLQX
site_description: JAX-native infrastructure for variational simulations in canonical Loop Quantum Gravity.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://neuralqx.readthedocs.io/en/latest/"]
repo_url: https://github.com/waleed-sh/neuraLQX
repo_name: waleed-sh/neuraLQX
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 The neuraLQX Authors
strict: true

theme:
  name: shadcn
  custom_dir: docs/overrides
  icon: assets/images/mark.svg
  favicon: assets/images/mark.svg
  accent: "#006d77"
  show_title: true
  show_stargazers: false
  show_datetime: false
  hide_source_files: true
  topbar_sections: false
  pygments_style:
    light: friendly
    dark: native
  katex_options:
    throwOnError: false

# Explicit order for authored pages. The hook fills the two API submenus.
