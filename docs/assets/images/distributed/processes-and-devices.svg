<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">Two hosts, two processes, eight global devices</title>
<desc id="desc">Each of two hosts runs one Python process controlling four GPUs. The processes cooperate in one global calculation, each owning four local shards.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#006d77"/></marker></defs>
