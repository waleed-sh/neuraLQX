<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
<title id="title">Eight devices in four tensor groups</title>
<desc id="desc">A two-by-two sample and operator grid. Each cell contains two tensor workers. Weights repeat across cells and are split inside each cell. During operator evaluation, each cell receives its sample subset and term group.</desc>
