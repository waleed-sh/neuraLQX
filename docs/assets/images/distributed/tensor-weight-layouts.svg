<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
<title id="title">Column and row partitions use Flax weight ordering</title>
<desc id="desc">Two views of a four-by-eight weight matrix. The column partition splits output features into two four-column blocks. The row partition splits input features into two two-row blocks.</desc>
