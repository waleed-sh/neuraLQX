<text x="400" y="326" font-size="21" fill="#18363b" font-weight="normal" text-anchor="middle">Every shard contains all 4 configuration labels</text>
<path d="M400 346 L400 397" stroke="#006d77" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="32" y="442" font-size="24" fill="#18363b" font-weight="bold" text-anchor="start">2. Operator evaluation: 4 × 2 mesh</text>
<text x="282" y="481" font-size="22" fill="#18363b" font-weight="normal" text-anchor="middle">Samples 0–511</text>
