<text x="304" y="175" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">8 chains × 16</text>
<rect x="412" y="119" width="168" height="75" rx="8" fill="#83c5be" stroke="none" stroke-width="2"/>
<text x="496" y="148" font-size="22" fill="#18363b" font-weight="bold" text-anchor="middle">Device 2</text>
<text x="496" y="175" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">8 chains × 16</text>
<rect x="604" y="119" width="168" height="75" rx="8" fill="#83c5be" stroke="none" stroke-width="2"/>
<text x="688" y="148" font-size="22" fill="#18363b" font-weight="bold" text-anchor="middle">Device 3</text>
<text x="688" y="175" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">8 chains × 16</text>
