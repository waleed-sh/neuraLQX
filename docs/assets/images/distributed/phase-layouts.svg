<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1010" viewBox="0 0 800 1010" role="img" aria-labelledby="title desc">
<title id="title">Phase-specific layouts on eight devices</title>
<desc id="desc">Sampling divides 64 chains into eight groups of eight. Operator evaluation redistributes 1024 configurations into two halves, each repeated across four squared-charge operator partitions. Contributions are summed over operators.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#006d77"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#18363b" font-size="21">
<rect x="0" y="0" width="800" height="1010" rx="18" fill="#edf6f9" stroke="none" stroke-width="2"/>
<text x="32" y="48" font-size="29" fill="#18363b" font-weight="bold" text-anchor="start">The same devices, different work layouts</text>
<text x="32" y="93" font-size="24" fill="#18363b" font-weight="bold" text-anchor="start">1. Sampling: 8 partitions of the chain axis</text>
<rect x="28" y="119" width="168" height="75" rx="8" fill="#83c5be" stroke="none" stroke-width="2"/>
<text x="112" y="148" font-size="22" fill="#18363b" font-weight="bold" text-anchor="middle">Device 0</text>
<text x="112" y="175" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">8 chains × 16</text>
