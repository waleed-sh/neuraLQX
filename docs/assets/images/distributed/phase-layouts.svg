<text x="400" y="868" font-size="22" fill="#18363b" font-weight="normal" text-anchor="middle">Sum the four term contributions for each sample</text>
<path d="M400 884 L400 923" stroke="#006d77" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="100" y="940" width="600" height="44" rx="8" fill="#006d77" stroke="none" stroke-width="2"/>
<text x="400" y="970" font-size="21" fill="white" font-weight="normal" text-anchor="middle">Reduce the global sample batch to an expectation</text>
