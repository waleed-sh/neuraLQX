<svg xmlns="http://www.w3.org/2000/svg" width="800" height="780" viewBox="0 0 800 780" role="img" aria-labelledby="title desc">
<title id="title">The symbolic compilation pipeline</title>
<desc id="desc">Validation, diagnostics, and normalisation precede cache lookup. A hit returns the stored artifact. A miss runs capacity, connectivity, cost, fusion, and kernel planning, then JAX lowering and native wrapping. Device compilation happens when the numerical function is called, separately from artifact caching.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#006d77"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#18363b">
<rect x="0" y="0" width="800" height="780" rx="18" fill="#edf6f9" stroke="none" stroke-width="2"/>
<text x="30" y="47" font-size="28" fill="#18363b" font-weight="bold" text-anchor="start">The symbolic compilation pipeline</text>
<rect x="30" y="90" width="465" height="62" rx="10" fill="#83c5be" stroke="none" stroke-width="2"/>
<text x="262" y="129" font-size="23" fill="#18363b" font-weight="normal" text-anchor="middle">Definition, IR, and resolved target</text>
<path d="M262 155 L262 184" fill="none" stroke="#006d77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="30" y="195" width="465" height="112" rx="10" fill="white" stroke="#006d77" stroke-width="2"/>
<text x="262" y="228" font-size="23" fill="#18363b" font-weight="bold" text-anchor="middle">Before cache lookup</text>
<text x="262" y="262" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">Validation and diagnostics</text>
<text x="262" y="291" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">Normalisation and signature</text>
<path d="M262 310 L262 339" fill="none" stroke="#006d77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="30" y="350" width="465" height="65" rx="10" fill="#ffddd2" stroke="#e29578" stroke-width="2"/>
<text x="262" y="390" font-size="24" fill="#18363b" font-weight="normal" text-anchor="middle">Artifact cache lookup</text>
<path d="M500 383 L549 383" fill="none" stroke="#006d77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="525" y="363" font-size="18" fill="#18363b" font-weight="normal" text-anchor="middle">Hit</text>
<rect x="560" y="343" width="205" height="106" rx="10" fill="#006d77" stroke="none" stroke-width="2"/>
<text x="662" y="380" font-size="21" fill="white" font-weight="normal" text-anchor="middle">Native operator</text>
<text x="662" y="409" font-size="21" fill="white" font-weight="normal" text-anchor="middle">Reports and plans</text>
<path d="M262 420 L262 456" fill="none" stroke="#006d77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="278" y="446" font-size="18" fill="#18363b" font-weight="normal" text-anchor="start">Miss</text>
<rect x="30" y="467" width="465" height="154" rx="10" fill="white" stroke="#006d77" stroke-width="2"/>
<text x="262" y="501" font-size="23" fill="#18363b" font-weight="bold" text-anchor="middle">Analyse and plan</text>
<text x="262" y="538" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">Raw capacity and target equivalence</text>
<text x="262" y="567" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">Collision obligations and assembly cost</text>
<text x="262" y="596" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">Fusion and structured kernel plan</text>
<path d="M262 625 L262 654" fill="none" stroke="#006d77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="30" y="665" width="465" height="65" rx="10" fill="#83c5be" stroke="none" stroke-width="2"/>
<text x="262" y="705" font-size="23" fill="#18363b" font-weight="normal" text-anchor="middle">JAX lowering and native wrapping</text>
<path d="M500 698 L784 698 L784 397 L771 397" fill="none" stroke="#006d77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M662 455 L662 498" fill="none" stroke="#006d77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="560" y="509" width="205" height="112" rx="10" fill="#ffddd2" stroke="none" stroke-width="2"/>
<text x="662" y="541" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">Numerical call</text>
<text x="662" y="570" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">JAX tracing</text>
<text x="662" y="599" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">Device compilation</text>
<text x="400" y="760" font-size="20" fill="#18363b" font-weight="normal" text-anchor="middle">Artifact reuse and device executable reuse are separate</text>
</g></svg>
