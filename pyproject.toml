#
#
#   Build backend

[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

#
#
#   Project information

[project]
name = "neuraLQX"
dynamic = ["version"]
description = "A high-performance simulations toolkit for loop quantum gravity."
# TODO: support 3.14 on next NetKet release
requires-python = ">=3.11,<3.14"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Waleed Sherif"}]
keywords = [
    "Netket",
    "Jax",
    "Machine learning",
    "Neural networks",
    "Neural Quantum States",
    "Quantum",
    "Loop quantum gravity",
    "Variational Monte Carlo"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Topic :: Scientific/Engineering :: Physics",
    "Development Status :: 4 - Beta",
]

#
#
#   Core dependencies

dependencies = [
    "tabulate",
    "humanize",
    "psutil",
    "NetKet>=3.20.0,<3.22.0",
    "jax<0.10.0",
    "jaxlib<0.10.0",
    "bs4",
    "plum-dispatch",
    "cryptography",
    "networkx",
    "matplotlib",
    "dash>=2.18.2",
    "plotly>=5.24.1,<=6.0.0",
    "optax>=0.2.4",
    "simplejson<4.0.0",
]

[tool.uv]
constraint-dependencies = [
  "grpcio-tools>=1.70.0",
]

#
#
#   Optional dependencies

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist[psutil]>=3",
    "pytest-json-report>=1.5",
    "coverage[toml]>=7.6",
    "pre-commit>=3.6",
    "black>=26.3.1",
    "ruff>=0.4",
    "mypy>=1.11",
    "build>=1.2",
    "wheel>=0.43",
]
cuda = ["NetKet[cuda]>=3.19.0; sys_platform == 'linux'"]
docs = [
    "Sphinx>=8.2.3,<9.1.0",
    "sphinx-rtd-theme~=3.0.0",
    "sphinx-copybutton==0.5.2",
    "myst-parser>=2.0.0,<4.1.0",
    "shibuya==2025.12.19",
    "sphinx-autobuild==2025.8.25",
    "sphinx-design>=0.4.0",
    "sphinx-autodoc-typehints>=1.22,<4.0",
    "myst-nb>=1.2,<1.4",
]
profile = [
    "nvidia-ml-py>=12.560.30",
    "py-cpuinfo>=9.0.0",
    "nvtx>=0.2.5",
    "tensorflow",
    "tensorboard-plugin-profile",
    "cupy",
]

[dependency-groups]
dev = [
    "neuralqx[dev,docs]",
]
docs = [
    "neuralqx[docs]"
]
profile = [
    "neuralqx[profile]"
]

#
#
#   URLs

[project.urls]
Homepage = "https://neuralqx.readthedocs.io"
Repository = "https://github.com/waleed-sh/neuralqx"
Issues = "https://github.com/waleed-sh/neuralqx/issues"
Documentation = "https://neuralqx.readthedocs.io/en/latest/documentation/api/index.html"
Changelog = "https://neuralqx.readthedocs.io/en/latest/change_log.html"


#
#
#   Scripts

[project.scripts]
djaxrun = "neuralqx.utils.jax.djaxrun:main"

#
#
#   Build instructions

[tool.hatch.build]
include = ["neuralqx*"]

[tool.hatch.build.targets.wheel.force-include]
# Install the .pth file at the site-packages root so Python auto-imports
# neuralqx._boot at interpreter startup before any user import runs.
"neuralqx_boot.pth" = "neuralqx_boot.pth"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "neuralqx/_version.py"
artifacts = ["neuralqx/_version.py"]
template = '''
# Copyright (c) 2026 The neuraLQX Authors - All rights reserved.
#
# Licensed under the Apache License, Version 2.0 (the "License");
# you may not use this file except in compliance with the License.
# You may obtain a copy of the License at
#
#    http://www.apache.org/licenses/LICENSE-2.0
#
# Unless required by applicable law or agreed to in writing, software
# distributed under the License is distributed on an "AS IS" BASIS,
# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
# See the License for the specific language governing permissions and
# limitations under the License.

#
#
#   Note: this file is autogenerated
#         dont change it, dont track it in version control

__all__ = [
    "__version__",
    "__version_tuple__",
    "version",
    "version_tuple",
]

TYPE_CHECKING = False
if TYPE_CHECKING:
    from typing import Tuple, Union
    VERSION_TUPLE = Tuple[Union[int, str], ...]
else:
    VERSION_TUPLE = object

version: str
__version__: str
__version_tuple__: VERSION_TUPLE
version_tuple: VERSION_TUPLE

__version__ = version = "{version}"
__version_tuple__ = version_tuple = {version_tuple}
'''

#
#
#   pytest setup

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
norecursedirs = [
  ".git", "dist", "build", "docs", ".*", "venv", ".venv", "__pycache__"
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=neuralqx",
    "--cov-report=term-missing",
    "--tb=short",
    "--durations=20",
]
markers = [
    "slow: long-running tests",
    "gpu: requires GPU",
    "integration: cross-module tests",
    "requires_jax: needs JAX",
    "requires_netket: needs NetKet",
    "flaky: known to be flaky",
    "large_memory: uses lots of RAM",
    "mpi: requires MPI runtime (gated by env vars)",
    "jaxjit: tests that require JAX JIT enabled (others run with jit disabled)",
]
filterwarnings = [
    "ignore:\\s*Module `neuralqx.experimental.operators.symbolic` is deprecated.*:FutureWarning",
    "error::DeprecationWarning:neuralqx\\.",
    "error::FutureWarning:neuralqx\\.",
    "default::ResourceWarning",
    "ignore:numpy.ufunc size changed:RuntimeWarning",
    "ignore:jaxlib.* will be removed.*:FutureWarning",
    "ignore:distutils package is deprecated:DeprecationWarning",
    "ignore:jax.core.ConcretizationTypeError is deprecated:DeprecationWarning",
    "ignore::neuralqx.utils.errors.IncompatibleModdedOperatorWarning",
    "ignore:.*Module `neuralqx.utils.mpi` is deprecated.*:FutureWarning",
    "ignore:Implicit conversion of an array to a dtype is deprecated.*:DeprecationWarning",
    "ignore:Setting `jax_pmap_shmap_merge` is deprecated.*:DeprecationWarning",
]


#
#
#   Coverage setup

[tool.coverage.run]
branch = true
source = ["neuralqx"]
parallel = true
concurrency = ["multiprocessing"]
command_line = "-m pytest --verbose tests"


[tool.coverage.report]
show_missing = true
skip_covered = true

omit = [
    "neuralqx/experimental/*",
    "neuralqx/**/__init__.py",
    "neuralqx/callbacks/*",
    "neuralqx/nn/*",
]


#
#
#   Black and linters

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["docs/", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = ["E501"]

#
#
#   MyPy

[tool.mypy]
show_error_codes = true
no_implicit_optional = true
warn_redundant_casts = true
disable_error_code = ["import-untyped"]
