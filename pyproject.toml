
[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"


[project]
name = "neuraLQX"
dynamic = ["version"]
description = "High performance simulations toolkit for variational loop quantum gravity."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Waleed Sherif" },
]
keywords = [
    "Jax",
    "Machine learning",
    "Neural networks",
    "Neural Quantum States",
    "Quantum",
    "Loop quantum gravity",
    "Variational Monte Carlo"
]

classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "jax>=0.9.0",
    "packaging>=24.0",
    "flax>=0.9.0",
    "plum-dispatch",
    "matplotlib",
    "optax",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "coverage[toml]>=7.6",
    "hatch>=1.14",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "twine>=6.0",
]
docs = [
    "myst-nb>=1.4",
    "myst-parser>=4.0",
    "shibuya>=2026.5.19",
    "sphinx>=8.1",
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinx-rtd-theme>=3.0",
]
cuda = [
    "jax[cuda12]>=0.9.0; platform_system == 'Linux'",
]
tpu = [
    "jax[tpu]>=0.9.0; platform_system == 'Linux'",
]

[project.urls]
Homepage = "https://neuralqx.readthedocs.io"
Documentation = "https://neuralqx.readthedocs.io"
Repository = "https://github.com/waleed-sh/neuralqx"
Issues = "https://github.com/waleed-sh/neuralqx/issues"
Changelog = "https://neuralqx.readthedocs.io/en/latest/change_log.html"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "coverage[toml]>=7.6",
    "hatch>=1.14",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "twine>=6.0",
]
docs = [
    "myst-nb>=1.4",
    "myst-parser>=4.0",
    "shibuya>=2026.5.19",
    "sphinx>=8.1",
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinx-rtd-theme>=3.0",
]

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }
fallback-version = "2.0.0.dev0"

[tool.hatch.build.hooks.vcs]
version-file = "neuralqx/_version.py"
artifacts = ["neuralqx/_version.py"]
template = '''
# Copyright (c) 2026 The neuraLQX Authors - All rights reserved.
#
# Licensed under the Apache License, Version 2.0 (the "License");
# you may not use this file except in compliance with the License.
# You may obtain a copy of the License at
#
#    http://www.apache.org/licenses/LICENSE-2.0
#
# Unless required by applicable law or agreed to in writing, software
# distributed under the License is distributed on an "AS IS" BASIS,
# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
# See the License for the specific language governing permissions and
# limitations under the License.

#
#
#   Note: this file is autogenerated
#         dont change it, dont track it in version control

__all__ = [
    "__version__",
    "__version_tuple__",
    "version",
    "version_tuple",
]

TYPE_CHECKING = False
if TYPE_CHECKING:
    from typing import Tuple, Union
    VERSION_TUPLE = Tuple[Union[int, str], ...]
else:
    VERSION_TUPLE = object

version: str
__version__: str
__version_tuple__: VERSION_TUPLE
version_tuple: VERSION_TUPLE

__version__ = version = "{version}"
__version_tuple__ = version_tuple = {version_tuple}
'''

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/neuralqx",
    "/pyproject.toml",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["neuralqx"]
only-packages = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "gpu: requires an accelerator backend",
    "integration: exercises multiple subsystems together",
    "jaxjit: requires JAX JIT compilation",
    "slow: long-running test",
]
filterwarnings = [
    "error::DeprecationWarning:neuralqx\\.",
    "error::FutureWarning:neuralqx\\.",
    "default::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["neuralqx"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["neuralqx", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "NPY",
    "RUF",
    "UP",
    "W",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["neuralqx"]
force-single-line = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
packages = ["neuralqx"]
show_error_codes = true
pretty = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disable_error_code = ["import-untyped"]
