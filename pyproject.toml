
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"


[project]
name = "neuraLQX"
dynamic = ["version"]
description = "High performance simulations toolkit for variational canonical loop quantum gravity."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Waleed Sherif" },
]
keywords = [
    "Jax",
    "Machine learning",
    "Neural networks",
    "Neural Quantum States",
    "Quantum",
    "Loop quantum gravity",
    "Variational Monte Carlo"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.9.0",
    "packaging>=24.0",
    "flax>=0.9.0",
    "plum-dispatch",
    "matplotlib",
    "networkx>=3.2",
    "optax",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "coverage[toml]>=7.6",
    "hatch>=1.14",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "twine>=6.0",
]
docs = [
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-jupyter>=0.25,<1.0",
    "mkdocs-material>=9.6,<10.0",
    "mkdocstrings[python]>=0.29,<2.0",
]
cuda = [
    "jax[cuda12]>=0.9.0; platform_system == 'Linux'",
]
tpu = [
    "jax[tpu]>=0.9.0; platform_system == 'Linux'",
]

[project.urls]
Homepage = "https://neuralqx.readthedocs.io"
Documentation = "https://neuralqx.readthedocs.io"
Repository = "https://github.com/waleed-sh/neuralqx"
Issues = "https://github.com/waleed-sh/neuralqx/issues"
Changelog = "https://neuralqx.readthedocs.io/en/latest/for-developers/change-log/"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "coverage[toml]>=7.6",
    "hatch>=1.14",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "twine>=6.0",
]
docs = [
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-jupyter>=0.25,<1.0",
    "mkdocs-material>=9.6,<10.0",
    "mkdocstrings[python]>=0.29,<2.0",
]

[tool.hatch.version]
path = "neuralqx/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/neuralqx",
    "/pyproject.toml",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["neuralqx"]
only-packages = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "gpu: requires an accelerator backend",
    "integration: exercises multiple subsystems together",
    "jaxjit: requires JAX JIT compilation",
    "slow: long-running test",
]
filterwarnings = [
    "error::DeprecationWarning:neuralqx\\.",
    "error::FutureWarning:neuralqx\\.",
    "default::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["neuralqx"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["neuralqx", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "NPY",
    "RUF",
    "UP",
    "W",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["neuralqx"]
force-single-line = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
packages = ["neuralqx"]
show_error_codes = true
pretty = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disable_error_code = ["import-untyped"]
